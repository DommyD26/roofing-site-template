<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>T^Rock CRM — Job Command Center</title>
  <meta name="theme-color" content="#0f0f12">
  <link rel="icon" href="../assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Load the font WITHOUT blocking first paint: on a roof with no signal,
       a normal stylesheet link would stall the whole app until it times out. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  <style>
    :root {
      --red: #c8102e;
      --red-deep: #a30d24;
      --red-dark: #a30d24; /* alias kept for inline styles in crm.js */
      --red-soft: #fdeef0;
      --red-line: #f5cdd4;
      --ink: #17181c;
      --ink-2: #3a3d45;
      --muted: #667085;
      --faint: #98a1b2;
      --page: #f6f6f8;
      --surface: #ffffff;
      --surface-2: #fafafb;
      --line: #ebecf0;
      --line-2: #dfe1e7;
      --green-text: #0f7a44;
      --green-bg: #e9f7ef;
      --amber-text: #935f10;
      --amber-bg: #fdf3e1;
      --blue-text: #1e56a0;
      --blue-bg: #eaf2fc;
      --purple-text: #6d3fa8;
      --purple-bg: #f3edfb;
      --orange-text: #a35112;
      --orange-bg: #fdefe2;
      --gray-bg: #f0f1f4;
      --gray-text: #4a5160;
      --r-lg: 16px;
      --r-md: 12px;
      --r-sm: 10px;
      --shadow-1: 0 1px 2px rgba(23, 24, 28, 0.04), 0 8px 24px rgba(23, 24, 28, 0.05);
      --shadow-2: 0 2px 6px rgba(23, 24, 28, 0.06), 0 16px 40px rgba(23, 24, 28, 0.10);
      --ring: 0 0 0 3px rgba(200, 16, 46, 0.14);
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; font-family: var(--font); color: var(--ink); background: var(--page);
      line-height: 1.55; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    h1, h2, h3 { letter-spacing: -0.02em; }
    :focus-visible { outline: none; box-shadow: var(--ring); border-radius: 6px; }
    a { color: var(--red); text-decoration-thickness: 1px; text-underline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }

    /* ---------- header ---------- */
    .site-header {
      background: rgba(15, 15, 18, 0.88);
      backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
      color: #fff; position: sticky; top: 0; z-index: 40;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }
    .header-bar {
      max-width: 1400px; margin: 0 auto; padding: 0.6rem 1.25rem;
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    }
    .logo {
      font-weight: 800; font-size: 1.02rem; letter-spacing: 0.01em;
      color: #fff; text-decoration: none; white-space: nowrap; display: flex; align-items: baseline; gap: 0.45rem;
    }
    .logo b { color: var(--red); font-weight: 800; }
    .logo span {
      color: #8b8e98; font-weight: 600; font-size: 0.72rem; letter-spacing: 0.14em;
      text-transform: uppercase; border-left: 1px solid rgba(255,255,255,0.16); padding-left: 0.45rem;
    }
    .logo .demo-badge {
      background: var(--red); color: #fff; font-size: 0.58rem; font-weight: 800; letter-spacing: 0.12em;
      padding: 0.12rem 0.5rem; border-radius: 999px; align-self: center; border: 0;
    }
    nav.tabs { display: flex; gap: 0.1rem; flex-wrap: nowrap; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
    nav.tabs::-webkit-scrollbar { display: none; }
    nav.tabs a {
      color: #a6aab6; text-decoration: none; font-size: 0.82rem; font-weight: 600;
      padding: 0.42rem 0.78rem; border-radius: 999px; white-space: nowrap;
      transition: color 0.15s, background 0.15s;
    }
    nav.tabs a:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
    nav.tabs a.active { color: #fff; background: var(--red); font-weight: 700; }
    #new-job-btn {
      background: var(--red); color: #fff; border: 0; border-radius: 999px; cursor: pointer;
      font: 700 0.82rem var(--font); padding: 0.48rem 1.05rem; white-space: nowrap;
      box-shadow: 0 2px 10px rgba(200, 16, 46, 0.35);
      transition: background 0.15s, transform 0.1s;
    }
    #new-job-btn:hover { background: var(--red-deep); }
    #new-job-btn:active { transform: scale(0.97); }

    /* ---------- layout ---------- */
    main#view { max-width: 1400px; margin: 0 auto; padding: 1.5rem 1.25rem 5rem; }
    main#view > * { animation: rise 0.22s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
    .page-head { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin: 0.25rem 0 1.25rem; }
    .page-head h1 { font-size: 1.5rem; font-weight: 800; margin: 0; }
    .page-head .spacer { flex: 1; }
    .sub { color: var(--muted); font-size: 0.86rem; margin: -0.85rem 0 1.1rem; }

    /* ---------- cards ---------- */
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
      box-shadow: var(--shadow-1); padding: 1.15rem 1.3rem; margin-bottom: 1rem;
    }
    .card h2 { font-size: 0.95rem; font-weight: 700; margin: 0 0 0.7rem; color: var(--ink); }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 1rem; align-items: start; }

    /* ---------- stat tiles ---------- */
    .stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 0.75rem; margin-bottom: 1.1rem; }
    .stat {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
      padding: 0.85rem 1rem 0.8rem; box-shadow: var(--shadow-1);
      display: flex; flex-direction: column-reverse; gap: 0.1rem;
    }
    .stat strong { font-size: 1.55rem; font-weight: 750; color: var(--ink); line-height: 1.15; letter-spacing: -0.02em; }
    .stat span { font-size: 0.76rem; font-weight: 550; color: var(--muted); }
    .stat.hot { border-color: var(--red-line); background: linear-gradient(180deg, #fff 55%, var(--red-soft)); }
    .stat.hot strong { color: var(--red); }

    /* ---------- buttons ---------- */
    .btn {
      padding: 0.5rem 1rem; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface);
      color: var(--ink); font: 600 0.84rem var(--font); cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s, box-shadow 0.15s;
    }
    .btn:hover { border-color: var(--faint); background: var(--surface-2); }
    .btn:active { transform: scale(0.98); }
    .btn.primary {
      background: var(--red); border-color: var(--red); color: #fff; font-weight: 700;
      box-shadow: 0 2px 8px rgba(200, 16, 46, 0.28);
    }
    .btn.primary:hover { background: var(--red-deep); border-color: var(--red-deep); }
    .btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
    .btn.small { padding: 0.32rem 0.7rem; font-size: 0.76rem; border-radius: 8px; }
    .btn.danger { color: var(--red); border-color: var(--line-2); background: var(--surface); }
    .btn.danger:hover { background: var(--red-soft); border-color: var(--red-line); }

    /* ---------- forms ---------- */
    input, select, textarea {
      padding: 0.55rem 0.8rem; border: 1px solid var(--line-2); border-radius: var(--r-sm);
      font: 400 0.92rem var(--font); color: var(--ink); background: #fff; width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--red); box-shadow: var(--ring); }
    input::placeholder, textarea::placeholder { color: var(--faint); }
    textarea { resize: vertical; min-height: 74px; }
    label { font-size: 0.75rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 0.25rem; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0.8rem; }
    .form-grid .wide { grid-column: 1 / -1; }
    .form-actions { display: flex; gap: 0.5rem; margin-top: 0.9rem; flex-wrap: wrap; }
    .search-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    .search-row input, .search-row select { width: auto; flex: 0 1 auto; }
    .search-row input[type=search] { flex: 1 1 230px; }

    /* ---------- chips ---------- */
    .chip {
      display: inline-flex; align-items: center; gap: 0.32rem;
      padding: 0.16rem 0.62rem; border-radius: 999px; font-size: 0.71rem; font-weight: 650; white-space: nowrap;
    }
    .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
    .chip.type::before, .chip.stage-paid::before { display: none; }
    .chip.stage-lead { background: var(--gray-bg); color: var(--gray-text); }
    .chip.stage-inspection { background: var(--blue-bg); color: var(--blue-text); }
    .chip.stage-proposal { background: var(--purple-bg); color: var(--purple-text); }
    .chip.stage-insurance { background: var(--amber-bg); color: var(--amber-text); }
    .chip.stage-approved { background: var(--green-bg); color: var(--green-text); }
    .chip.stage-production { background: var(--orange-bg); color: var(--orange-text); }
    .chip.stage-complete { background: var(--green-bg); color: var(--green-text); }
    .chip.stage-paid { background: var(--ink); color: #fff; }
    .chip.stage-lost { background: var(--red-soft); color: var(--red-deep); }
    .chip.type { background: var(--gray-bg); color: var(--gray-text); }
    .chip.overdue { background: var(--red-soft); color: var(--red-deep); }
    .chip.today { background: var(--amber-bg); color: var(--amber-text); }

    /* ---------- tables ---------- */
    .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    th, td { padding: 0.6rem 0.8rem; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    th {
      background: var(--surface-2); color: var(--muted); font-size: 0.72rem; font-weight: 650;
      letter-spacing: 0.01em; white-space: nowrap; border-bottom: 1px solid var(--line-2);
    }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: var(--surface-2); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

    /* ---------- kanban board ---------- */
    .board { display: flex; gap: 0.8rem; overflow-x: auto; padding-bottom: 1.25rem; align-items: flex-start; }
    .col {
      flex: 0 0 272px; background: var(--gray-bg); border-radius: var(--r-md); padding: 0.55rem;
      border: 1px solid transparent; transition: border-color 0.15s, background 0.15s;
    }
    .col.drop-hover { border-color: var(--red); background: var(--red-soft); }
    .col h3 {
      font-size: 0.74rem; margin: 0.2rem 0.35rem 0.6rem; letter-spacing: 0.02em;
      display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; color: var(--ink-2);
      text-transform: uppercase; font-weight: 700;
    }
    .col h3 .count {
      color: var(--muted); background: #fff; border-radius: 999px; padding: 0 0.45rem;
      font-size: 0.68rem; border: 1px solid var(--line);
    }
    .col h3 .colsum { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
    .kcard {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm);
      padding: 0.65rem 0.75rem; margin-bottom: 0.5rem; cursor: grab;
      box-shadow: 0 1px 2px rgba(23, 24, 28, 0.05); font-size: 0.82rem;
      transition: box-shadow 0.15s, transform 0.12s, border-color 0.15s;
    }
    .kcard:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); border-color: var(--line-2); }
    .kcard.dragging { opacity: 0.45; }
    .kcard strong { display: block; font-size: 0.88rem; font-weight: 700; }
    .kcard .kmeta { color: var(--muted); font-size: 0.75rem; display: block; }
    .kcard .kmoney { font-weight: 750; color: var(--ink); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
    .kcard .kflags { margin-top: 0.35rem; display: flex; gap: 0.3rem; flex-wrap: wrap; align-items: center; }
    .kmove {
      margin-left: auto; background: transparent; border: 1px solid var(--line-2); border-radius: 999px;
      font: 650 0.67rem var(--font); color: var(--muted); padding: 0.15rem 0.55rem; cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .kmove:hover { border-color: var(--red); color: var(--red); }
    .stage-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .stage-list .btn { text-align: left; }

    /* ---------- job detail ---------- */
    .job-head { display: flex; align-items: flex-start; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .job-head h1 { margin: 0 0 0.15rem; font-size: 1.5rem; font-weight: 800; }
    .job-head .meta { color: var(--muted); font-size: 0.88rem; }
    .stage-stepper { display: flex; gap: 0.3rem; flex-wrap: wrap; margin: 0.85rem 0 1.15rem; align-items: center; }
    .stage-stepper button {
      border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; cursor: pointer;
      font: 600 0.73rem var(--font); padding: 0.32rem 0.72rem; color: var(--muted);
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .stage-stepper button.done { background: var(--gray-bg); color: var(--ink-2); border-color: transparent; }
    .stage-stepper button.current { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 700; }
    .stage-stepper button:hover { border-color: var(--red); color: var(--red); }
    .stage-stepper button.current:hover { color: #fff; }
    .stage-stepper .advance {
      background: var(--red); color: #fff; border-color: var(--red); font-weight: 750;
      box-shadow: 0 2px 8px rgba(200, 16, 46, 0.28);
    }
    .stage-stepper .advance:hover { background: var(--red-deep); color: #fff; }
    .kv { display: grid; grid-template-columns: minmax(130px, 38%) 1fr; gap: 0.3rem 0.85rem; font-size: 0.88rem; }
    .kv dt { color: var(--muted); font-weight: 500; }
    .kv dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    .linkrow { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .linkrow a {
      text-decoration: none; border: 1px solid var(--line-2); border-radius: 999px;
      padding: 0.32rem 0.85rem; font-size: 0.78rem; font-weight: 650; color: var(--ink); background: var(--surface);
      transition: border-color 0.15s, color 0.15s;
    }
    .linkrow a:hover { border-color: var(--red); color: var(--red); }

    /* checklist / tasks */
    ul.checklist { list-style: none; margin: 0; padding: 0; }
    ul.checklist li { display: flex; align-items: flex-start; gap: 0.6rem; padding: 0.48rem 0; border-bottom: 1px solid var(--line); font-size: 0.88rem; }
    ul.checklist li:last-child { border-bottom: 0; }
    ul.checklist li > div { flex: 1; min-width: 0; }
    ul.checklist input[type=checkbox] { width: 1.1rem; height: 1.1rem; margin-top: 0.16rem; accent-color: var(--red); flex: none; cursor: pointer; }
    ul.checklist .t-due { font-size: 0.73rem; color: var(--muted); display: block; }
    ul.checklist li.done .t-title { text-decoration: line-through; color: var(--faint); }
    ul.checklist .t-job { font-size: 0.73rem; color: var(--red); font-weight: 650; text-decoration: none; display: block; }
    .t-del {
      background: none; border: 0; color: var(--faint); cursor: pointer; font-size: 0.8rem;
      padding: 0.12rem 0.4rem; border-radius: 6px; flex: none; opacity: 0.6;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
    }
    .t-del:hover { opacity: 1; color: var(--red); background: var(--red-soft); }

    /* timeline */
    .timeline { max-height: 430px; overflow-y: auto; font-size: 0.84rem; }
    .timeline > div { padding: 0.5rem 0 0.5rem 0.9rem; border-left: 2px solid var(--line); position: relative; }
    .timeline > div::before {
      content: ""; position: absolute; left: -4.5px; top: 0.95rem;
      width: 7px; height: 7px; border-radius: 50%; background: var(--line-2);
    }
    .timeline time { color: var(--faint); font-size: 0.71rem; margin-right: 0.5rem; white-space: nowrap; }
    .note-body { white-space: pre-wrap; }

    /* money helper */
    .calc {
      background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm);
      padding: 0.7rem 0.9rem; font-size: 0.84rem; margin-top: 0.65rem;
    }
    .calc strong.good { color: var(--green-text); }
    .calc strong.bad { color: var(--red-deep); }

    /* ---------- modal ---------- */
    .modal-back {
      position: fixed; inset: 0; background: rgba(15, 15, 18, 0.45);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      z-index: 60; display: flex; align-items: flex-start; justify-content: center;
      padding: 4vh 1rem; overflow-y: auto;
    }
    .modal {
      background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-2);
      width: 100%; max-width: 720px; padding: 1.35rem 1.5rem;
      animation: rise 0.18s ease-out both;
    }
    .modal h2 { margin-top: 0; font-size: 1.1rem; }

    /* ---------- toasts ---------- */
    #toasts {
      position: fixed; bottom: 1.1rem; left: 50%; transform: translateX(-50%);
      z-index: 80; display: flex; flex-direction: column; gap: 0.4rem; align-items: center;
    }
    .toast {
      background: var(--ink); color: #fff; padding: 0.6rem 1.1rem; border-radius: 999px;
      font-size: 0.84rem; font-weight: 550; box-shadow: var(--shadow-2); animation: pop 0.2s ease-out;
    }
    @keyframes pop { from { transform: translateY(8px); opacity: 0; } }

    .empty { color: var(--faint); font-size: 0.88rem; padding: 0.5rem 0.2rem; }
    .danger-zone { border-color: var(--red-line); }

    /* ---------- first-run tour ---------- */
    .tour-invite {
      position: fixed; right: 16px; bottom: 16px; z-index: 70;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
      box-shadow: var(--shadow-2); padding: 1rem 1.1rem;
      width: min(310px, calc(100vw - 24px)); animation: pop 0.25s ease-out;
    }
    .tour-invite b { font-size: 0.95rem; }
    .tour-invite p { margin: 0.3rem 0 0.75rem; font-size: 0.84rem; color: var(--ink-2); }
    .tour-invite .row { display: flex; gap: 0.5rem; }
    .tour-backdrop { position: fixed; inset: 0; background: rgba(15, 15, 18, 0.45); z-index: 61; }
    .tour-glow {
      position: relative !important; z-index: 62 !important; border-radius: 12px;
      box-shadow: 0 0 0 3px var(--red), 0 0 0 7px rgba(200, 16, 46, 0.25),
        0 0 0 9999px rgba(15, 15, 18, 0.45) !important;
    }
    .tour-card {
      position: fixed; z-index: 70; width: min(330px, calc(100vw - 24px));
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
      box-shadow: var(--shadow-2); padding: 1rem 1.15rem 0.9rem; animation: rise 0.2s ease-out;
    }
    .tour-card.center { left: 50%; top: 16vh; transform: translateX(-50%); }
    .tour-card h3 { margin: 0.35rem 0 0.25rem; font-size: 0.98rem; letter-spacing: -0.01em; }
    .tour-card p { margin: 0 0 0.85rem; font-size: 0.85rem; color: var(--ink-2); line-height: 1.5; }
    .tour-track { height: 6px; background: var(--gray-bg); border-radius: 999px; overflow: hidden; margin-top: 0.15rem; }
    .tour-track i { display: block; height: 100%; background: var(--red); border-radius: 999px; transition: width 0.25s; }
    .tour-count { font-size: 0.69rem; color: var(--muted); font-weight: 600; display: block; margin-top: 0.3rem; }
    .tour-x {
      position: absolute; top: 0.5rem; right: 0.55rem; background: none; border: 0;
      color: var(--faint); cursor: pointer; font-size: 1rem; padding: 0.2rem 0.4rem; border-radius: 6px;
    }
    .tour-x:hover { color: var(--red); background: var(--red-soft); }
    .tour-btns { display: flex; gap: 0.5rem; justify-content: flex-end; }
    @media (max-width: 720px) {
      .tour-invite, .tour-card:not(.center), .tour-card.center {
        left: 12px; right: 12px; width: auto; top: auto; transform: none;
        bottom: calc(4.8rem + env(safe-area-inset-bottom));
      }
    }

    /* ---------- mobile: app-style bottom navigation ---------- */
    @media (max-width: 720px) {
      /* backdrop-filter would trap the fixed bottom nav inside the header */
      .site-header { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(15, 15, 18, 0.97); }
      .header-bar { padding: 0.55rem 0.9rem; }
      main#view { padding: 1rem 0.85rem 6.5rem; }
      /* ≥16px stops iOS Safari from zooming the page on every field tap */
      input, select, textarea { font-size: 16px; }
      .kv { grid-template-columns: 1fr; }
      .kv dt { margin-top: 0.4rem; }
      .page-head h1, .job-head h1 { font-size: 1.3rem; }

      nav.tabs {
