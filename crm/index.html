<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Agent CRM — Business Development HQ</title>
  <link rel="icon" href="../assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
  <style>
    :root {
      --navy:#16325c; --navy-deep:#0f2444; --ember:#b93d15; --gold:#e3c08d;
      --page:#f5f6f8; --ink:#1b2534; --muted:#5b6472; --line:#e5e8ee;
      --green:#1d5c38; --green-bg:#e8f4ec; --red:#8f2b2b; --red-bg:#fbecec;
      --amber:#775217; --amber-bg:#fdf4e3; --blue:#1c4374; --blue-bg:#e7f0fb;
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      --shadow:0 1px 2px rgba(15,36,68,.05),0 4px 16px rgba(15,36,68,.06);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font);background:var(--page);color:var(--ink);line-height:1.55}
    header{background:var(--navy-deep);color:#fff;padding:.7rem 1.1rem;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;position:sticky;top:0;z-index:40}
    header h1{margin:0;font-size:1.02rem;white-space:nowrap}
    header h1 span{color:var(--gold);font-weight:600}
    nav.tabs{display:flex;gap:.15rem;flex-wrap:wrap}
    nav.tabs a{color:#cfd8e6;text-decoration:none;font-size:.83rem;font-weight:700;padding:.4rem .7rem;border-radius:8px}
    nav.tabs a.active{background:var(--ember);color:#fff}
    nav.tabs a:hover{color:#fff}
    header .right{margin-left:auto;display:flex;gap:.5rem;align-items:center;font-size:.72rem;color:#9fb0c8}
    #sync-dot{width:9px;height:9px;border-radius:50%;background:#8a93a3;display:inline-block}
    #sync-dot.ok{background:#43b56f} #sync-dot.err{background:#e2574b} #sync-dot.busy{background:var(--gold)}
    main{max-width:1150px;margin:0 auto;padding:1.1rem 1.1rem 3rem}

    .btn{padding:.5rem 1rem;border-radius:9px;border:1px solid #d4d9e2;background:#fff;color:var(--navy);font-weight:700;font-size:.84rem;cursor:pointer;font-family:var(--font)}
    .btn.primary{background:var(--ember);border-color:var(--ember);color:#fff}
    .btn.quiet{border-color:transparent;background:transparent}
    .btn.small{padding:.3rem .65rem;font-size:.76rem}
    .btn.danger{color:var(--red);border-color:#e7c8c8}
    .btn:disabled{opacity:.5;cursor:default}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:1.05rem 1.2rem;margin-bottom:1rem}
    .muted{color:var(--muted);font-size:.85rem}
    .tiny{font-size:.74rem;color:var(--muted)}
    h2{font-size:1.02rem;color:var(--navy);margin:0 0 .6rem}
    h3{font-size:.9rem;color:var(--navy);margin:0 0 .4rem}
    .row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
    .spread{justify-content:space-between}

    input,select,textarea{padding:.5rem .7rem;border:1px solid #d4d9e2;border-radius:9px;font-size:.9rem;font-family:var(--font);background:#fff;color:var(--ink)}
    textarea{width:100%;min-height:90px;resize:vertical}
    label.f{display:block;font-size:.72rem;font-weight:700;color:var(--muted);margin-bottom:.7rem}
    label.f input,label.f select{width:100%;margin-top:.25rem}
    .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.15rem .8rem}

    .stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:.65rem;margin-bottom:1rem}
    .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:.75rem .5rem;text-align:center;box-shadow:var(--shadow)}
    .stat strong{display:block;font-size:1.32rem;color:var(--navy)}
    .stat span{font-size:.7rem;font-weight:600;color:var(--muted)}
    .stat.hot strong{color:var(--ember)}

    table{width:100%;border-collapse:collapse;font-size:.84rem}
    th,td{padding:.5rem .65rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
    th{background:var(--navy);color:#fff;font-size:.72rem;letter-spacing:.03em;position:sticky;top:0;white-space:nowrap}
    th.sort{cursor:pointer;user-select:none}
    tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--blue-bg)}
    td.num,th.num{text-align:right}
    .table-scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}

    .chip{display:inline-block;padding:.13rem .55rem;border-radius:999px;font-size:.69rem;font-weight:700;white-space:nowrap}
    .c-green{background:var(--green-bg);color:var(--green)} .c-amber{background:var(--amber-bg);color:var(--amber)}
    .c-red{background:var(--red-bg);color:var(--red)} .c-blue{background:var(--blue-bg);color:var(--blue)}
    .c-gray{background:#eef0f4;color:#5b6472}
    .tag{display:inline-block;background:#eef0f4;color:var(--navy);border-radius:6px;padding:.05rem .45rem;font-size:.7rem;font-weight:600;margin:.08rem .18rem .08rem 0}
    .tier{display:inline-flex;align-items:center;justify-content:center;width:1.5rem;height:1.5rem;border-radius:8px;font-weight:800;font-size:.78rem}
    .tier.A{background:var(--green-bg);color:var(--green)} .tier.B{background:var(--amber-bg);color:var(--amber)} .tier.C{background:#eef0f4;color:#5b6472}

    .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:1rem;align-items:start}
    .feed{max-height:380px;overflow-y:auto;font-size:.8rem}
    .feed>div{padding:.4rem 0;border-bottom:1px dashed var(--line)}
    .feed time{color:var(--muted);margin-right:.5rem;font-size:.71rem}
    .backlink{color:var(--ember);font-weight:700;cursor:pointer;font-size:.85rem;text-decoration:none}
    .err{color:var(--red);font-weight:700}
    .money{font-variant-numeric:tabular-nums}
    .pos{color:var(--green);font-weight:700} .neg{color:var(--red);font-weight:700}

    /* modal */
    #modal-wrap{position:fixed;inset:0;background:rgba(15,36,68,.45);display:none;align-items:flex-start;justify-content:center;z-index:80;padding:3rem 1rem;overflow-y:auto}
    #modal-wrap.open{display:flex}
    #modal{background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);max-width:640px;width:100%;padding:1.2rem 1.4rem}
    #modal h2{margin-top:0}

    /* toasts */
    #toasts{position:fixed;bottom:1rem;right:1rem;z-index:99;display:flex;flex-direction:column;gap:.5rem}
    .toast{background:var(--navy-deep);color:#fff;padding:.65rem 1rem;border-radius:10px;font-size:.84rem;box-shadow:var(--shadow);max-width:320px}
    .toast.bad{background:var(--red)}

    .kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem}
    .kcol{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem}
    .kcol h4{margin:0 0 .3rem;font-size:.72rem;color:var(--muted);letter-spacing:.03em}
    .kcol .kv{font-size:1.1rem;font-weight:800;color:var(--navy)}
    .kcol .ks{font-size:.7rem;color:var(--muted)}

    .touch-btns{display:flex;gap:.35rem;flex-wrap:wrap}
    .recip{border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;margin-bottom:.45rem;font-size:.82rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
    .recip.done{opacity:.45}
    .recip .who{font-weight:700;min-width:160px}
    code.mf{background:#eef0f4;border-radius:5px;padding:.05rem .35rem;font-size:.75rem}
    .helpbox{background:var(--blue-bg);border-radius:10px;padding:.6rem .8rem;font-size:.78rem;color:var(--blue);margin-bottom:.8rem}
    @media (max-width:640px){ header{padding:.6rem .8rem} main{padding:.8rem .6rem 3rem} #modal{padding:1rem} }
  </style>
</head>
<body>
  <header>
    <h1>🤝 Agent CRM <span>· Business Development HQ</span></h1>
    <nav class="tabs" id="tabs">
      <a href="#/dash" data-tab="dash">Dashboard</a>
      <a href="#/agents" data-tab="agents">Agents</a>
      <a href="#/jobs" data-tab="jobs">Referrals</a>
      <a href="#/marketing" data-tab="marketing">Marketing</a>
      <a href="#/settings" data-tab="settings">Settings</a>
    </nav>
    <div class="right"><span id="sync-dot"></span><span id="sync-label">local only</span></div>
  </header>

  <main id="app"><p class="muted">Loading…</p></main>

  <div id="modal-wrap"><div id="modal" role="dialog" aria-modal="true"></div></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="crm.js"></script>
</body>
</html>
