<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roofing Construction &amp; Estimating — The E-Course</title>
  <meta name="description" content="A 12-module online course companion to Roofing Construction & Estimating by Daniel Atcheson — from measuring roofs to bidding profitable jobs, with quizzes and progress tracking.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🏠</text></svg>">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <button id="menu-toggle" aria-label="Toggle course menu" aria-expanded="false">☰</button>
      <a class="logo" href="#/home">ROOFING <span>Construction &amp; Estimating</span> · E-Course</a>
      <a class="book-link" id="header-book-link" href="#" target="_blank" rel="noopener">📖 Open the book (PDF)</a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Course navigation"></aside>
    <main id="app" aria-live="polite"></main>
  </div>

  <footer class="site-footer">
    <div class="bar">
      <p>&copy; <span id="year"></span> — Companion e-course to <em>Roofing Construction &amp; Estimating, Revised</em> by Daniel Atcheson
        (<a href="https://craftsman-book.com/" target="_blank" rel="noopener">Craftsman Book Company</a>).
        Lessons are original summaries; refer to the book for complete chapters. Progress is saved in this browser.</p>
    </div>
  </footer>

  <script src="assets/course-data.js"></script>
  <script src="assets/course.js"></script>
  <script>
    (function () {
      var link = document.getElementById("header-book-link");
      if (window.COURSE) link.href = window.COURSE.bookUrl;
      var btn = document.getElementById("menu-toggle");
      var side = document.getElementById("sidebar");
      btn.addEventListener("click", function () {
        var open = side.classList.toggle("open");
        btn.setAttribute("aria-expanded", open ? "true" : "false");
      });
      side.addEventListener("click", function (e) {
        if (e.target.closest("a")) {
          side.classList.remove("open");
          btn.setAttribute("aria-expanded", "false");
        }
      });
    })();
  </script>
</body>
</html>
