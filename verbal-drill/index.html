  s:"Cheapest to install or cheapest to own — those are different roofs. Give me a big open warehouse on steel deck and cheapest install is probably mechanically attached TPO, with ballasted EPDM in the fight if the structure takes the weight. But put grease on that roof or a second existing layer under it and my answer changes on the spot." },
{ t:4, c:"Trap", q:"\"Which is better — silicone, or a reinforced polyester system?\"", o:["Silicone, hands down","Reinforced polyester, obviously","That's comparing a chemistry to a construction — polyester reinforcement goes IN a coating, including silicone. A reinforced silicone system is both at once","Neither works on roofs"], a:2,
  w:"Category error. Silicone is a coating chemistry; reinforced polyester describes how a liquid system is built — fabric embedded in the liquid, whatever the chemistry. The trap tests whether you'll pick a side in a comparison that doesn't parse.",
  s:"Those aren't competitors — one's a chemistry and one's a way of building the system. Polyester fabric gets embedded in a coating, and that coating can be silicone. So the real question is which chemistry for this exposure, and whether the substrate needs full reinforcement. Ask me that one and I'll pick." },
{ t:4, c:"Trap", q:"\"Owner has $40,000. The roof needs a $150,000 tear-off — it's wet, it's two layers deep. What system do you install for his $40k?\"", o:["A thin recover — something is better than nothing","A coating — it's all the budget buys","None — no system succeeds on that roof for $40k. Spend it on targeted repairs, drainage fixes and dry-in of the worst areas, documented as a bridge to the real scope","Take the $40k as a deposit and start"], a:2,
  w:"Every named system is genuinely wrong: recover is code-prohibited at two layers and over wet material, coating over saturated insulation fails and no manufacturer warrants it. The passing answer says 'nothing succeeds here' out loud, then puts the $40k to honest triage work with the replacement scoped for when funding exists.",
  s:"For forty thousand I can't install him a roof that works — recover is illegal over two wet layers, and a coating over soaked insulation is just an expensive way to fail. What I can do is spend it surgically — fix the worst leaks, get drainage moving, dry in the critical areas — and hand him a documented plan to the real replacement. That's the only honest use of his money." },
{ t:4, c:"Trap", q:"\"Thirty-story tower, ballasted EPDM, owner wants the cheapest replacement. Go.\"", o:["Re-ballast with the same stone — proven for 30 years","Cheapest is mech-attached TPO, same as any warehouse","Height is the problem — the ballasted standard stops around 150 feet, so this is engineered wind design and almost certainly a conversion. Before pricing anything I need the structure, deck and edge conditions","Coat the old EPDM and skip replacement talk"], a:2,
  w:"The trap is 'cheapest' hiding the real governor: at 30 stories, the code-referenced ballasted standard no longer applies and loose ballast at that height is a wind-design non-starter — plus stone removal logistics dominate cost. The answer leads with the disqualifier, then scopes what's needed to price the conversion honestly.",
  s:"At thirty stories the cheap conversation ends at the wind design. The ballasted standard runs out around a hundred fifty feet, so nothing loose-laid is defensible up there — this roof converts to an adhered or fastened system under an engineer's wind design, and craning thirty years of stone off is half the job. Cheapest starts after those facts, not before them." },
{ t:4, c:"Trap", q:"\"Simple question. TPO or PVC?\"", o:["TPO — it owns the market","PVC — it's been around longer","For what exposure? General field work, TPO usually wins on cost. Grease, chemicals or fire-adjacent exposure, PVC. Tell me what's on the roof and I'll commit","They're identical products"], a:2,
  w:"Naked either/or with the deciding variable withheld. The answer names the variable (exposure), gives the honest default each way, and asks the one question that resolves it — demonstrating you choose systems by condition, not allegiance.",
  s:"Depends what the roof has to survive. Clean warehouse air, TPO wins on price and it welds great. Kitchen grease, chemical exhaust or an owner who wants the most weld-friendly sheet ten years from now, I'm at PVC. Tell me what's blowing out of the fans and I'll give you a one-word answer." },
{ t:4, c:"Trap", q:"Aaron nods along with your answer, then asks: \"How do you know you're right?\"", o:["Twenty years of experience, that's how","Because that's what everyone does","I check it — code section, the manufacturer's published detail, a core cut or pull test where it's a field question. If I can't point to the source, I say it's judgment and I label it that way","My gut has never failed"], a:2,
  w:"Behavioral probe: is your confidence sourced or performed? The passing answer names verification habits — code text, manufacturer literature, physical testing — and distinguishes cited fact from labeled judgment. 'Experience' alone is the trap answer; it's how confident wrong answers sound.",
  s:"Because I can show you where it comes from. If it's a code claim I'll pull the section, if it's a system claim I'll pull the manufacturer's detail or data sheet, and if it's a field condition I core it or pull-test it instead of guessing. And when something's just my judgment, I'll say that word out loud so you know which kind of answer you're getting." },
{ t:4, c:"Trap", q:"He asks you something you genuinely don't know. The room is quiet. You:", o:["Give the most confident guess available — never show weakness","Change the subject smoothly","Say you don't know, say precisely where you'd find it and how fast, and follow up with the sourced answer","Blame the question"], a:2,
  w:"The test is whether you'll bluff. In this trade a confident wrong answer becomes a leak, a claim or an injury. 'I don't know, here's exactly how I find out, you'll have it by tomorrow' — delivered without flinching — is a senior answer, and following through is the actual pass.",
  s:"I don't know that one cold, and I'm not going to guess at it in front of you. Here's what I'd do — check the manufacturer's spec and the code section tonight and have you a sourced answer by morning. The guys who bluff that question are the ones who cost somebody a building later." },
{ t:4, c:"Trap", q:"\"What would make you walk away from a job?\" — and he's watching how fast you answer.", o:["Nothing — revenue is revenue","Only jobs that are too small","Being asked to build a known failure or hide one — roof over wet insulation, skip the permit, bury bad deck, cut fall protection. Price is negotiable, that isn't","Rainy season"], a:2,
  w:"Integrity probe. The answer needs named, concrete lines — safety, legality, concealment of defects, installing systems known to fail — delivered without hedging. 'Nothing' fails on character; vague virtue fails on specificity.",
  s:"The day the job requires me to lie or build a failure. If an owner wants me to roof over wet insulation, skip the permit, bury rotten deck, or run a crew without fall protection, I'm out — no price fixes those. I'll negotiate money all day, but not physics and not safety." },
{ t:4, c:"Trap", q:"He builds it live: \"Warehouse, steel deck, one dry existing roof — your system?\" You say mech TPO. \"Now there's a fryer exhaust line on it.\" Then: \"Now the survey shows ponding by the drains.\" Then: \"Turns out there are already two roofs up there.\" What's the passing behavior?", o:["Defend mech TPO to the end — changing answers looks weak","Restart from scratch, flustered, at every addition","Update out loud each time: grease moves it to PVC, ponding adds tapered work, and the second layer converts the whole thing to a tear-off — with the trigger named at each step","Stop answering after the second change"], a:2,
  w:"The stack test: will you keep defending a dead answer? Each variable is a specific trigger — chemistry, drainage, code layer limit — and the passing pattern is updating immediately, naming why, and landing on tear-off with PVC and tapered insulation. Loyalty to your first answer is the trap.",
  s:"Every fact you added just changed my roof, and I'll say so each time. The fryer line moves me off TPO to PVC. The ponding adds tapered insulation to the scope. And the second existing roof ends the recover completely — now it's a tear-off, then tapered, then PVC. New information beats my old answer every single time." },
{ t:4, c:"Trap", q:"\"Fine — then what's the BEST membrane?\"", o:["PVC — pound for pound the champion","Whatever the biggest manufacturer makes","There isn't a best one, and anyone with a best one is selling it. There's a right one per building — exposure, deck, code, budget, hold period. Give me a building and I'll name it","60-mil anything"], a:2,
  w:"Same trap as 'cheapest,' dressed up. Membranes are tools matched to conditions; a contractor with one answer for every building is running a product line, not a practice. Commit to the matching process, then demonstrate it instantly when given conditions.",
  s:"There's no best membrane, there's a right membrane for a building — and a guy who names one without asking questions is selling you his inventory. Hand me the building. Restaurant row, I'll say PVC. Big dry box, probably TPO. Hail alley on a budget, maybe a heavy EPDM. The skill isn't the pick, it's the match." },
{ t:4, c:"Trap", q:"\"A coating fixes leaks, right? Roof leaks, we coat it, done?\"", o:["Right — that's the whole point of coatings","Only silicone fixes leaks","Backwards — coatings preserve roofs that already don't leak. Leaks get found and repaired first, wet material comes out, and then a coating extends what's left. Coating an active leak seals a failure in","Two coats fixes anything"], a:2,
  w:"Restoration systems require sound, dry substrates — repairs come first and the coating is life-extension, not leak repair. Wet insulation under a fresh coating keeps rotting on the owner's dime with a warranty that excludes it. This confusion is common enough that examiners test for it specifically.",
  s:"That's backwards, and it's the most expensive backwards in roofing. A coating preserves a roof that's already sound — so we find the leaks, repair them, cut out anything wet, and then the coating buys the roof another decade. Coat an active leak and you've just paid good money to hide it while it grows." },
{ t:4, c:"Trap", q:"He hands you a work order for a building you've never seen: \"Can you overlay this roof? Yes or no.\"", o:["Yes — overlays almost always work","No — overlays are always trouble","Not yet answerable — I need the layer count, moisture findings, the covering type and the deck. If it's one dry layer and not tile, likely yes and I'll say so. Two layers, wet, or tile, no","Whatever the last contractor said"], a:2,
  w:"Yes-or-no is the trap frame; the recover decision is gated by code prohibitions (layers, moisture, covering type) and field condition. The passing answer names the exact gates, states the likely-yes case, and refuses to certify a roof sight-unseen — while still sounding decisive, not evasive.",
  s:"I can tell you exactly what makes it a yes, but not from a work order. One existing layer, cores dry, and it's not tile — then yes, we overlay it and I'll stand behind that. Two layers, wet insulation, or tile up there and the code itself says no. Get me forty-five minutes on that roof with a core cutter and you'll have your one-word answer." },
{ t:4, c:"Trap", q:"\"Another contractor told my client that with coatings, nobody ever needs a tear-off again. React.\"", o:["He's right — coatings ended tear-offs","Say nothing — never discuss competitors","Coatings are great tools with hard disqualifiers — wet insulation, failed adhesion, deteriorated substrates. A roof that's structurally done still comes off. I'd show the client the disqualifier list, not an argument","Report him to somebody"], a:2,
  w:"Tests whether you'll counter overselling with facts instead of rivalry. Restoration legitimately defers tear-offs on sound roofs — but manufacturers' own substrate requirements define where it can't go. Teaching the client the disqualifiers positions you as the honest expert without naming-calling.",
  s:"Coatings are a real tool and I sell them — on the right roof. But every coating manufacturer publishes the same disqualifiers, and wet insulation is the big one. You can't paint over soaked material and call it saved. So never say never a tear-off — say not yet, as long as the roof under it stays sound and dry, and prove that with a survey." },
{ t:4, c:"Trap", q:"\"This system's cheapest per square foot today. Why wouldn't the owner just buy it every time?\"", o:["He should — today's price is the only real number","Because cheap systems are all scams","Because the owner buys years of dry building, not squares of material — hold period, maintenance, warranty and replacement timing decide the real cost. Cheapest today is often priciest per year","Because expensive feels better"], a:2,
  w:"First-cost tunnel vision is the tested error. The answer reframes to cost per year of service over the owner's hold period — where a cheap short-lived system frequently loses — while conceding the case where first cost legitimately rules: short holds and bridge strategies.",
  s:"Because he's not buying squares, he's buying dry years. Stretch each option across what it really costs per year — install, upkeep, when it needs replacing — and the cheap roof is often the expensive one. Now if he's selling the building in two years, fine, today's price might honestly be the whole story. That's why I ask the hold question first." },
{ t:4, c:"Trap", q:"\"The roof has an old acrylic coating on it. Just shoot silicone over that, right? And if the silicone chalks out someday, we'll acrylic over it. Same thing both directions?\"", o:["Exactly — coatings stack freely both ways","Never coat over any coating, ever","Not symmetric. Silicone over sound, tested acrylic can work with the manufacturer's prep and adhesion patches. But nothing bonds to cured silicone — going onto silicone later means silicone again, or removal","Alternate them yearly for balance"], a:2,
  w:"Direction matters. Over existing acrylic: verify adhesion of what's there, prep and prime per the silicone manufacturer, and prove it with test patches. But cured silicone's release surface rejects other chemistries — a silicone roof is a silicone commitment. The trap is agreeing to the symmetry.",
  s:"One direction works, one doesn't. Silicone can go over that old acrylic if it's still stuck tight — we test patches and follow the manufacturer's prep. But the day you silicone a roof, you've married it, because nothing else will ever bond to cured silicone. Recoats from then on are silicone or a tear-off of the coating. I make sure the owner hears that before the first drum opens." },
{ t:4, c:"Trap", q:"\"Two 60-mil sheets, two prices. Sixty mil is sixty mil — buy the cheap one, right?\"", o:["Right — thickness is the spec","Wrong — always buy the expensive one","The mil number isn't the sheet. Thickness over scrim, polymer and stabilizer package, weld window — that's what ages. The data sheets and the warranty terms are the comparison, not the label","Buy both and mix them"], a:2,
  w:"Nominal thickness hides the quality variables: mil-over-scrim, formulation, weathering package, and what warranty the manufacturer will actually stand behind. 'Always buy expensive' is equally lazy — the passing answer is compare the published data, then decide.",
  s:"Sixty mil tells me almost nothing by itself. What matters is how much membrane rides above the scrim and what's in the polymer, because that's the part that has to survive twenty summers. Put the two data sheets and the two warranty offers side by side — sometimes the cheap sheet holds up fine, and sometimes you just found out why it's cheap." },
{ t:4, c:"Trap", q:"\"Just tell me the R-value we need on this replacement. One number.\"", o:["R-20 — memorize it","R-30 to be safe","The number comes from whichever energy code edition this city has adopted, for our climate zone, for above-deck insulation — and it moves when they adopt a new edition. I confirm with the jurisdiction before pricing, because tearing to the deck triggers full current code","Whatever fits the budget"], a:2,
  w:"Reciting a memorized R fails the moment the jurisdiction's adopted edition differs. The durable answer is the mechanism — replacement exposing the deck triggers current-code insulation, the value is a lookup against the adopted IECC edition and climate zone, verified with the AHJ. Process over trivia.",
  s:"I won't give you a number from memory, because the right one lives in whichever energy code this city has adopted, and cities around here are on different editions. What I know cold is the trigger — the day we expose that deck, current code owns the insulation spec. So I make one call to the building department, and then my number is bulletproof instead of close." },
{ t:4, c:"Trap", q:"On the roof, he stomps a dry-looking area: \"Looks fine. Sign off that it's dry.\"", o:["Sign it — it looks and feels fine","Refuse to ever certify anything","Looks tells me nothing about the insulation — wet roofs walk fine on sunny days. I'll sign after a moisture scan and cores say dry, and that paper protects both of us","Sign it but keep a copy"], a:2,
  w:"Surface appearance doesn't reveal saturated insulation — that's what IR or capacitance scanning plus confirming cores exist for. The trap is certifying from a stomp. The pass is the polite refusal wired to the method that produces a signature you'd defend.",
  s:"It walks fine, and so do plenty of soaked roofs on a sunny day. The water we care about is down in the insulation where a boot can't feel it. Scan it after sunset, core the warm spots, and if they come up dry I'll sign it with a clean conscience — that's me protecting your name and mine on the same sheet of paper." },
{ t:4, c:"Trap", q:"\"Schedule's tight. Skip the manufacturer's final inspection and mail the warranty in later — nobody will care, right?\"", o:["Right — inspections are ceremony","Right, if photos are good","The inspection is typically what activates the NDL — skip it and the owner may hold a roof with no system warranty. If schedule's tight, we schedule the inspector now, not skip them","Only new crews need inspections"], a:2,
  w:"System warranties are generally issued after the manufacturer's completion inspection and punch list. Skipping it risks exactly the coverage the owner paid a premium for. The pass is refusing the shortcut and solving the actual constraint — the calendar — by managing the inspector's schedule like any other trade.",
  s:"That inspection is the birth certificate of the warranty — skip it and the owner paid NDL money for a roof with no NDL. If the schedule's the problem, I get the inspector booked today and build his date into the plan like every other trade. I've never met an owner who'd trade their warranty for one week of calendar." },
{ t:4, c:"Trap", q:"\"Owner wants a hail-proof roof. Sell him one.\"", o:["Easy — sell impact-rated TPO as hail-proof","Tell him hail-proof doesn't exist and stop there","No such thing as hail-proof, and I won't sell the word. There are impact-rated assemblies — heavier membranes, cover boards, protected membranes — that survive most events, and insurance handles the rest. He gets 'hail-resistant, and here's exactly what that means'","Recommend moving the building"], a:2,
  w:"Selling 'hail-proof' writes a check the roof can't cash and litigation collects. The pass is refusing the word while still solving the need: impact-rated assemblies, cover boards over the insulation, thicker or fleece-backed membranes, and honest framing of what ratings mean alongside insurance strategy.",
  s:"I can't sell hail-proof because the sky doesn't sign contracts. What I can build is seriously hail-resistant — a heavier membrane over a hard cover board instead of bare foam, tested impact ratings, details that take a beating. He gets the honest word and the toughest assembly his money buys, and his insurance covers the storm nobody builds for." }
);
/* ---------------- storage: window.storage -> localStorage -> memory ---------------- */
const SKEY = "crvd-scores";
let MEM = null;
async function loadScores() {
  try {
    if (window.storage && typeof window.storage.get === "function") {
      const v = await window.storage.get(SKEY);
      const parsed = typeof v === "string" ? JSON.parse(v) : v;
      if (parsed && typeof parsed === "object") return parsed;
    }
  } catch (e) {}
  try {
    const v = JSON.parse(localStorage.getItem(SKEY));
    if (v && typeof v === "object") return v;
  } catch (e) {}
  return MEM || {};
}
function saveScores(s) {
  MEM = s;
  try { if (window.storage && typeof window.storage.set === "function") { window.storage.set(SKEY, JSON.stringify(s)); } } catch (e) {}
  try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (e) {}
}

/* ---------------- helpers ---------------- */
const app = document.getElementById("app");
function el(tag, cls, html) { const n = document.createElement(tag); if (cls) n.className = cls; if (html !== undefined) n.innerHTML = html; return n; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const TIERS = [
  { name: "Easy", desc: "Identification and fundamentals. Answerable without thinking." },
  { name: "Medium", desc: "Standard application. One governing condition, one right answer." },
  { name: "Hard", desc: "Competing constraints and code triggers. Two options look right." },
  { name: "Expert", desc: "Cost, risk, warranty, sales strategy, running the job." },
  { name: "Aaron", desc: "Traps. Every named system is wrong until you ask a question." }
];

let SCORES = {};
let run = null; // {tier, order, i, right}

/* ---------------- views ---------------- */
function viewTiers() {
  app.innerHTML = "";
  app.appendChild(el("div", "standard", "<strong>The grading standard</strong><br>Answer out loud. Name the variables, commit anyway, give the one-sentence reason, then say what would change your mind."));
  TIERS.forEach((t, i) => {
    const qs = QUESTIONS.filter(q => q.t === i).length;
    const s = SCORES["t" + i];
    const row = el("button", "tier-row t" + i);
    row.type = "button";
    row.innerHTML = '<span class="tier-num">' + i + "</span>" +
      '<span class="tier-body"><h2>' + esc(t.name) + "</h2><p>" + esc(t.desc) + "</p>" +
      '<p class="tier-score">' + (s && s.runs ? "Best <b>" + s.best + "/" + qs + "</b> · last " + s.last + "/" + qs + " · " + s.runs + " run" + (s.runs > 1 ? "s" : "") : qs + " questions · not attempted") + "</p></span>";
    row.onclick = () => startTier(i);
    app.appendChild(row);
  });
  window.scrollTo(0, 0);
}

function startTier(tier) {
  const idx = QUESTIONS.map((q, i) => q.t === tier ? i : -1).filter(i => i >= 0);
  run = { tier, order: shuffle(idx), i: 0, right: 0 };
  viewQuestion();
}

function viewQuestion() {
  const q = QUESTIONS[run.order[run.i]];
  app.innerHTML = "";
  app.appendChild(el("div", "qmeta",
    '<span class="cat">' + esc(q.c) + "</span><span>" + esc(TIERS[run.tier].name) + " · " + (run.i + 1) + " / " + run.order.length + "</span>"));
  app.appendChild(el("p", "qtext", esc(q.q)));

  const optWrap = el("div", "");
  app.appendChild(optWrap);
  const after = el("div", "");
  app.appendChild(after);

  // options render in shuffled order so answer position carries no signal
  const order = shuffle([0, 1, 2, 3]);
  const correctPos = order.indexOf(q.a);
  const btns = order.map((srcIdx, pos) => {
    const b = el("button", "opt", esc(q.o[srcIdx]));
    b.type = "button";
    b.onclick = () => answer(pos);
    optWrap.appendChild(b);
    return b;
  });

  function answer(pos) {
    const ok = pos === correctPos;
    if (ok) run.right++;
    btns.forEach((b, i) => {
      b.disabled = true;
      if (i === correctPos) { b.classList.add("right"); b.innerHTML = '<span class="tick">✓</span>' + esc(q.o[order[i]]); }
      else if (i === pos) { b.classList.add("wrong"); b.innerHTML = '<span class="tick">✕</span>' + esc(q.o[order[i]]); }
    });
    const rev = el("div", "reveal");
    rev.appendChild(el("p", "verdict " + (ok ? "ok" : "no"), ok ? "Right" : "Not this time"));
    rev.appendChild(el("div", "why", '<b class="lab">Why</b>' + esc(q.w)));
    rev.appendChild(el("div", "say", '<b class="lab">🗣 Say it like this</b><p>&ldquo;' + esc(q.s) + '&rdquo;</p>'));
    const ctl = el("div", "ctl");
    const next = el("button", "btn", run.i + 1 < run.order.length ? "Next →" : "Finish");
    next.type = "button";
    next.onclick = () => { run.i++; run.i < run.order.length ? viewQuestion() : viewSummary(); };
    const quit = el("button", "btn quiet", "Exit tier");
    quit.type = "button";
    quit.onclick = viewTiers;
    ctl.appendChild(next); ctl.appendChild(quit);
    rev.appendChild(ctl);
    after.appendChild(rev);
    next.focus({ preventScroll: true });
  }
  window.scrollTo(0, 0);
}

function viewSummary() {
  const total = run.order.length;
  const key = "t" + run.tier;
  const s = SCORES[key] || { best: 0, last: 0, runs: 0 };
  s.last = run.right;
  s.best = Math.max(s.best, run.right);
  s.runs++;
  SCORES[key] = s;
  saveScores(SCORES);

  app.innerHTML = "";
  const sum = el("div", "sum");
  sum.appendChild(el("div", "big", run.right + "/" + total));
  sum.appendChild(el("h2", "", esc(TIERS[run.tier].name) + " tier complete"));
  const pct = run.right / total;
  sum.appendChild(el("p", "muted",
    pct === 1 ? "Clean run. Say them out loud next time and it counts double." :
    pct >= 0.8 ? "Exam-ready territory. Re-run your misses until the spoken answers come out on their own." :
    pct >= 0.5 ? "The bones are there. Read every &ldquo;Say it like this&rdquo; out loud — the wording is the skill." :
    "Rough one. Slow down, read the Why blocks, and take the tier again tomorrow."));
  const ctl = el("div", "ctl"); ctl.style.justifyContent = "center";
  const again = el("button", "btn quiet", "↻ Repeat tier");
  again.type = "button"; again.onclick = () => startTier(run.tier);
  ctl.appendChild(again);
  if (run.tier < 4) {
    const adv = el("button", "btn", "Advance to " + TIERS[run.tier + 1].name + " →");
    adv.type = "button"; adv.onclick = () => startTier(run.tier + 1);
    ctl.appendChild(adv);
  }
  const home = el("button", "btn quiet", "All tiers");
  home.type = "button"; home.onclick = viewTiers;
  ctl.appendChild(home);
  sum.appendChild(ctl);
  app.appendChild(sum);
  window.scrollTo(0, 0);
}

/* ---------------- field reference ---------------- */
function viewRef() {
  app.innerHTML =
  '<div class="ref">' +

  "<h2>How to structure a spoken answer</h2>" +
  '<ol class="steps">' +
  "<li><b>Name the variables.</b> Say out loud what the answer depends on — deck, exposure, layers, moisture, hold period. This is the step that separates you from a salesman.</li>" +
  "<li><b>Commit anyway.</b> Pick the most likely case and give a real answer. Naming variables without committing reads as dodging.</li>" +
  "<li><b>One-sentence reason.</b> The single governing fact — the code trigger, the chemistry, the warranty term.</li>" +
  "<li><b>Say what would change your mind.</b> One condition that flips your answer. This is what mastery sounds like.</li>" +
  "</ol>" +

  "<h2>Intake checklist — ask before recommending anything</h2>" +
  "<ul>" +
  "<li>What deck is it, and what shape is it in?</li>" +
  "<li>How many roof coverings are up there already?</li>" +
  "<li>What do the cores and the moisture scan say?</li>" +
  "<li>What discharges onto the roof — grease, chemicals, exhaust?</li>" +
  "<li>Where does water go, and where does it stand?</li>" +
  "<li>How tall is the building and what are the edge and parapet conditions?</li>" +
  "<li>Is the building occupied during the work? Where are the air intakes?</li>" +
  "<li>How long does the owner plan to hold the building?</li>" +
  "<li>What warranty does the owner actually want?</li>" +
  "<li>Which code editions has this jurisdiction adopted?</li>" +
  "</ul>" +

  "<h2>Deck → attachment</h2>" +
  '<div class="table-scroll"><table>' +
  "<tr><th>Deck</th><th>What holds</th><th>Watch for</th></tr>" +
  "<tr><td>Steel</td><td>Screws — mechanically attached shines; adhered over board fine</td><td>Gauge and corrosion; fastener back-out over time</td></tr>" +
  "<tr><td>Structural concrete</td><td>Drilled anchors or fully adhered; ballast if structure allows</td><td>Moisture in new pours; drilling near embedded items</td></tr>" +
  "<tr><td>Lightweight insulating concrete</td><td>LWIC-specific fasteners proven by pull tests, or base-sheet systems</td><td>Standard screws strip; verify withdrawal values on the roof</td></tr>" +
  "<tr><td>Gypsum</td><td>Specialty fasteners with field pull tests, or adhered</td><td>Friable, weak pullout, often wet — treat with suspicion</td></tr>" +
  "<tr><td>Cementitious wood fiber</td><td>Specialty fasteners, verified; adhered approaches</td><td>Fastener spin-out; moisture damage; span sag</td></tr>" +
  "<tr><td>Wood / plank</td><td>Screws and nails hold well; most systems work</td><td>Rot at eaves and penetrations; combustible — no direct torch</td></tr>" +
  "</table></div>" +

  "<h2>Code triggers to know cold</h2>" +
  "<ul>" +
  "<li><b>Recover prohibited</b> when the existing roof is water-soaked or deteriorated, when two or more coverings exist, or when the covering is slate, clay, cement or asbestos-cement tile.</li>" +
  "<li><b>A protective roof coating</b> over an eligible existing covering is permitted without tear-off and is not counted as an additional covering — restoration survives on a two-roof building when a recover cannot.</li>" +
  "<li><b>Design slope</b> for new membrane roofs is 1/4 in 12 (coal tar 1/8 in 12). Reroofing is excepted where positive drainage exists.</li>" +
  "<li><b>Secondary (overflow) drainage</b> is required where parapets or edges would impound water if primary drains block.</li>" +
  "<li><b>Ballasted wind design</b> runs through the code-referenced standard (ANSI/SPRI RP-4) — applies up to 150 ft, with parapet and edge-zone limits; taller means engineered design.</li>" +
  "<li><b>Edge metal securement</b> runs through the code-referenced ANSI/SPRI ES-1 testing.</li>" +
  "<li><b>Energy code:</b> replacement exposing the deck triggers insulation to current code. The value depends on the adopted IECC edition and climate zone — confirm with the jurisdiction before pricing. Recovers generally don't trigger it.</li>" +
  "</ul>" +

  "<h2>When each system wins</h2>" +
  '<div class="table-scroll"><table>' +
  "<tr><th>System</th><th>Wins when</th><th>Disqualified by</th></tr>" +
  "<tr><td>TPO (mech.)</td><td>Big open roofs, steel deck, first-cost pressure, reflectivity</td><td>Grease/chemical exposure; owners who hate flutter</td></tr>" +
  "<tr><td>PVC / KEE</td><td>Restaurants, grease, chemical exhaust, long weldability</td><td>Direct asphalt contact without a separator</td></tr>" +
  "<tr><td>EPDM</td><td>Hail-prone areas (thick sheets), simple big roofs, ballast jobs</td><td>Grease and oils; taped seams as the weak point</td></tr>" +
  "<tr><td>Mod bit (SBS/APP)</td><td>Redundancy, high foot traffic, small cut-up roofs, repair-friendly</td><td>Odor/flame limits on occupied buildings (pick the right application)</td></tr>" +
  "<tr><td>BUR</td><td>Redundancy and proven mass; institutional owners who spec it</td><td>Kettle logistics, odor, weight, fewer crews that do it well</td></tr>" +
  "<tr><td>Metal</td><td>Slope visible from grade, longevity, snow country</td><td>Low slope, complex penetrations, first cost</td></tr>" +
  "<tr><td>SPF</td><td>Irregular decks, max R per inch, seamless self-flashing</td><td>Applicator/weather sensitivity; permanent coating commitment</td></tr>" +
  "<tr><td>Coating restoration</td><td>Sound dry roof, budget bridge, two-layer buildings, short holds</td><td>Wet insulation, failed adhesion, deteriorated substrate</td></tr>" +
  "</table></div>" +

  "<h2>Coating disqualifiers — walk away when</h2>" +
  "<ul>" +
  "<li>The insulation is wet — wet material comes out; venting doesn't dry it.</li>" +
  "<li>Adhesion test patches fail after proper prep and primer.</li>" +
  "<li>The membrane or substrate is past sound — a coating is not a structural repair.</li>" +
  "<li>Ponding areas with anything but silicone chemistry.</li>" +
  "<li>Single-ply without the manufacturer's membrane-specific primer (low-energy surfaces).</li>" +
  "<li>Asphalt substrates under acrylic without a bleed-blocking primer.</li>" +
  "<li>Grease-saturated surfaces that can't be cleaned to the manufacturer's standard.</li>" +
  "<li>Going over cured silicone with anything except silicone.</li>" +
  "</ul>" +

  "<h2>Warranty types</h2>" +
  "<ul>" +
  "<li><b>Material-only</b> — manufacturer covers defective material, no labor, often prorated. The cheapest paper.</li>" +
  "<li><b>System / NDL</b> — manufacturer covers leaks from material and workmanship, labor included, no dollar cap. Requires approved applicator, approved assembly, completion inspection, documented maintenance.</li>" +
  "<li><b>Contractor workmanship</b> — your own promise on installation, typically 2–10 years. It's only as good as your company.</li>" +
  "<li><b>Common exclusions</b> — ponding (48-hour language), unauthorized penetrations and trades damage, storms beyond rated limits, neglected maintenance, chemical exposure outside the chemistry.</li>" +
  "</ul>" +

  "<h2>Who moves a commercial buying decision</h2>" +
  "<ol>" +
  "<li><b>Owner</b> — signs the check. Speaks money, risk, hold period.</li>" +
  "<li><b>Property / facility manager</b> — gatekeeper and recommender. Speaks disruption, tenants, and not getting blamed.</li>" +
  "<li><b>Consultant / engineer / architect</b> — gates the spec where present. Speaks documents.</li>" +
  "<li><b>CPA</b> — shapes capital-versus-expense and timing. Speaks tax years.</li>" +
  "<li><b>Building maintenance staff</b> — sees everything first and can champion or bury you. Speak to them with respect.</li>" +
  "</ol>" +

  '<p class="note">Sources discipline: code claims come from the adopted building and energy codes (including the wind and edge standards the code references), product claims from the manufacturer\'s published data sheets, details and warranty terms, and safety claims from OSHA. Anything that\'s field practice rather than a requirement — like the ~25% wet-area tear-off threshold — gets labeled as practice when you say it out loud.</p>' +
  "</div>";
  window.scrollTo(0, 0);
}

/* ---------------- tabs & boot ---------------- */
const tabDrill = document.getElementById("tab-drill");
const tabRef = document.getElementById("tab-ref");
function setTab(which) {
  tabDrill.classList.toggle("on", which === "drill");
  tabRef.classList.toggle("on", which === "ref");
  if (which === "drill") viewTiers(); else viewRef();
}
tabDrill.onclick = () => setTab("drill");
tabRef.onclick = () => setTab("ref");

loadScores().then(s => { SCORES = s || {}; viewTiers(); }).catch(() => { SCORES = {}; viewTiers(); });

</script>
